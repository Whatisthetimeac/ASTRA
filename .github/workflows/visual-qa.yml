name: ASTRA — inspeção visual de navegador
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador para testes
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar desktop, celular e interações
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/astra-server.log 2>&1 &
          sleep 2
          node tests/visual-qa.mjs
      - name: Publicar capturas de revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-preview-desktop-mobile
          path: artifacts/*.png
          if-no-files-found: warn
