name: ASTRA — validar site estático
on:
  push:
    branches: [main, feat/mvp-jornada-estelar]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/circuitos.js
          node --check assets/js/search.js
      - name: Verificar identidade visual e integridade do dashboard
        run: node tests/validate-dashboard.mjs
      - name: Testes de integridade das aulas
        run: node tests/validate-circuits.mjs
      - name: Verificar arquivos e referencias essenciais
        run: |
          test -s index.html
          test -s assets/css/styles.css
          test -s assets/js/circuitos.js
          for name in led button traffic buzzer ldr sonar servo lcd dht logic; do test -s "assets/images/circuitos/$name.svg"; done
          grep -q 'data-page="circuitos"' index.html
          grep -q "circuitos:'Circuitos e lógica'" assets/js/app.js
